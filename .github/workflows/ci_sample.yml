name: Code check sample
on:
  push:
    branches:
      - stg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Free up space early
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10.14

      - name: Clear pip cache
        run: pip cache purge

      - name: Install pipenv
        run: pip install pipenv

      # Install only dev libs (no duplication inside docker yet)
      - name: Install dev libs
        run: pipenv install --dev --python $(which python)

      - name: Run Black for code formatting
        run: pipenv run black .

      - name: Run isort for code formatting
        run: pipenv run isort .

      - name: Run pylint for code quality
        run: pipenv run pylint --fail-under=8.0 $(git ls-files "*.py")

      # Build docker image with --no-cache to avoid leftover layers, but use cleaned environment
      - name: Build Docker image
        run: docker build --no-cache --rm -t test_run .

      - name: Run Unit Test
        run: docker run --rm test_run pytest
